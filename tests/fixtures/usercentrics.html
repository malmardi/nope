<!-- Usercentrics banner (normally inside a shadow root), simplified. -->
<div id="usercentrics-root">
  <div data-testid="uc-default-banner" role="dialog" aria-label="Usercentrics">
    <p>We use cookies and similar technologies.</p>
    <button data-testid="uc-more-button" data-expect="safe">Settings</button>
    <button data-testid="uc-deny-all-button" data-expect="safe">Deny</button>
    <button data-testid="uc-accept-all-button" data-expect="accept">Accept All</button>
    <button data-testid="uc-save-button" data-expect="safe">Save Settings</button>
  </div>
</div>
