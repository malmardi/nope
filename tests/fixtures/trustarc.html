<!-- TrustArc banner and preferences, simplified. -->
<div id="truste-consent-track" role="region" aria-label="TrustArc">
  <div id="truste-consent-content">
    <p>This site uses cookies and related technologies.</p>
    <button id="truste-show-consent" data-expect="safe">Cookie Preferences</button>
    <button id="truste-consent-required" data-expect="safe">Required Only</button>
    <button id="truste-consent-button" data-expect="accept">Accept All Cookies</button>
  </div>
  <div class="pdynamicbutton">
    <a class="required" href="#" role="button" data-expect="safe">Decline All</a>
    <a class="call" href="#" role="button" data-expect="safe">Submit Preferences</a>
  </div>
</div>
