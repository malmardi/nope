<!-- Contents of a Sourcepoint message iframe, simplified. -->
<div class="message-container" role="dialog" aria-label="Sourcepoint">
  <p>We and our partners store and access information on your device.</p>
  <div class="message-row">
    <button title="Settings" class="message-component message-button sp_choice_type_12" data-expect="safe">Settings</button>
    <button title="Reject" class="message-component message-button sp_choice_type_13" data-expect="safe">Reject</button>
    <button title="Accept" class="message-component message-button sp_choice_type_11" data-expect="accept">Accept</button>
  </div>
  <div class="pm-actions">
    <button class="sp_choice_type_REJECT_ALL" data-expect="safe">Reject all</button>
    <button class="sp_choice_type_SAVE_AND_EXIT" data-expect="safe">Save &amp; exit</button>
    <button class="sp_choice_type_ACCEPT_ALL" data-expect="accept">Accept all</button>
  </div>
</div>
