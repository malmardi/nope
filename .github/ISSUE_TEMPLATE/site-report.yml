name: Site report
description: A cookie banner that Nope didn't reject or hide
title: "Banner not handled: "
labels: ["site-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The fields below were filled in by the extension. Nothing else about your browsing is included.
  - type: input
    id: site
    attributes:
      label: Site
      description: Hostname only, no full address.
      placeholder: example.com
    validations:
      required: true
  - type: input
    id: status
    attributes:
      label: What Nope showed
      placeholder: Missed one
  - type: input
    id: version
    attributes:
      label: Extension version
  - type: input
    id: browser
    attributes:
      label: Browser
  - type: textarea
    id: details
    attributes:
      label: What did you see?
      description: Optional. For example, the wording on the banner's buttons, or the country you were browsing from.
