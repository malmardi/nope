<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nope</title>
    <script type="module" src="./popup.ts"></script>
  </head>
  <body>
    <div class="popup">
      <header class="bar">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M6.5 17.5l11-11"></path></svg>
          </span>
          <span class="brand-name" data-brand-name>Nope</span>
        </div>
        <button id="settings" class="icon-button" type="button" aria-label="Settings">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
        </button>
      </header>

      <main class="content">
        <section class="site-card" aria-label="This site" role="status">
          <div class="site-top">
            <div class="site">
              <span class="site-label">This site</span>
              <span id="host" class="site-host">&nbsp;</span>
            </div>
            <span id="pill" class="pill" data-status="none"></span>
          </div>
          <p id="detail" class="site-detail">&nbsp;</p>
        </section>

        <section class="counter" aria-live="polite">
          <span id="count" class="count">0</span>
          <span id="count-label" class="count-label">banners rejected</span>
          <span id="saved" class="saved">&nbsp;</span>
        </section>

        <label class="row toggle-row">
          <span>Active on this site</span>
          <input id="active" type="checkbox" checked />
        </label>

        <button id="pro-allow" class="row pro-row" type="button">
          <span class="row-title">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
            Always allow this site
          </span>
          <span class="pro-tag">PRO</span>
        </button>
      </main>

      <footer class="foot">
        <a id="report" href="#">Banner still showing? Report it</a>
        <span class="promise">Open source · No data sold</span>
      </footer>
    </div>
  </body>
</html>
