<!-- Didomi notice, simplified. -->
<div id="didomi-host">
  <div id="didomi-popup" class="didomi-popup-notice" role="dialog" aria-label="Didomi">
    <p>We and our partners use cookies to store and access information on your device.</p>
    <a href="javascript:void(0)" class="didomi-popup-close" id="didomi-notice-disagree-button" data-expect="safe">Continue without agreeing →</a>
    <button id="didomi-notice-learn-more-button" data-expect="safe">Learn More →</button>
    <button id="didomi-notice-agree-button" data-expect="accept">Agree and close</button>
  </div>
</div>
